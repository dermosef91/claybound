<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/mother-puff.css"><style>body{margin:0}canvas{width:100vw;height:100vh;display:block}#review{position:fixed;bottom:14px;left:14px;z-index:50;display:flex;gap:6px}#review button{padding:7px 12px;background:#f2dec1;color:#463b4b;border-radius:8px;border:1px solid #bba791}#readout{position:fixed;top:12px;left:16px;color:#423545;font:14px monospace;z-index:30}</style></head><body><canvas id="world"></canvas><output id="readout">Loading…</output><div id="mother-mist" class="mother-mist hidden"></div><div id="mother-hud" class="mother-hud hidden"><div class="mother-heading"><strong>Mother Puff</strong><span data-boss-hits></span></div><div class="mother-pips"><i data-boss-pip></i><i data-boss-pip></i><i data-boss-pip></i></div><p data-boss-status></p></div><nav id="review"><button data-pose="sleeping">Sleepy</button><button data-pose="release">Casting</button><button data-pose="field">Ground spores</button><button data-pose="play">Play fight</button><button data-pose="auto">Input replay</button><button data-pose="paused">Pause</button></nav><script type="module">
import {World} from '/world.js';import {Game} from '/simulation.js';import {updateMotherHUD} from '/mother-puff-hud.js';
const w=new World(document.querySelector('canvas'));await w.ready;const g=new Game(e=>w.event(e));g.start(1);await w.prepareLevel(g.level);const keys=new Set();let auto=false;
function reset(mode){g.start(1);Object.assign(g.player,{x:281.5,y:33.4,groundId:'mother-arena'});g.checkpoint={x:264,y:33.4};g.checkpointId='heart-bell';w.build(g.level,1,281.5);g.level.boss.state='sleeping';auto=mode==='auto';if(['release','field'].includes(mode)){for(let i=0;i<(mode==='release'?275:505);i++)g.tick(1/120,{});}g.status=['play','auto'].includes(mode)?'playing':'paused';w.cameraX=287;w.cameraY=39.1;}
reset('sleeping');document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{if(b.dataset.pose==='paused')g.status=g.status==='paused'?'playing':'paused';else reset(b.dataset.pose);});
window.addEventListener('keydown',e=>{keys.add(e.code);e.preventDefault()});window.addEventListener('keyup',e=>keys.delete(e.code));let prev=performance.now(),accum=0,pressed=false,stomp=false;
function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;accum+=dt;while(accum>=1/120){const p=g.player,b=g.level.boss;let aim=b.state==='defeated'?311:b.x-5.9;if(p.motherBounce)aim=b.x;const jump=keys.has('Space'),down=keys.has('ArrowDown')||keys.has('KeyS');g.tick(1/120,auto?{moveAxis:Math.max(-1,Math.min(1,(aim-p.x)*5/6.7)),jumpHeld:true,stompPressed:p.motherBounce&&p.y>b.y+7.1&&Math.abs(p.x-b.x)<1.5}:{right:keys.has('ArrowRight')||keys.has('KeyD'),left:keys.has('ArrowLeft')||keys.has('KeyA'),jumpHeld:jump,jumpPressed:jump&&!pressed,stompPressed:down&&!stomp});pressed=jump;stomp=down;accum-=1/120;}w.render(g,dt);updateMotherHUD(g,document.querySelector('#mother-hud'),document.querySelector('#mother-mist'),true);document.querySelector('#readout').textContent=`HP ${g.player.health} · ${g.level.boss.state} · stomps ${g.level.boss.hits}/3 · ${g.status}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
