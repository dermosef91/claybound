# Publishes the playable game to GitHub Pages.
#
# dist/ is the authored, ready-to-serve game and stays that way: it runs from
# any static server with no build step, which is what keeps it editable. The
# hosted site is built from it rather than copied, because serving the authored
# files costs a first-time player 93 separate JavaScript requests and 2 MB of
# unminified three.js. `npm run build` bundles and minifies that into build/,
# leaving dist/ untouched; see LOCAL-DEPLOYMENT.md to serve either locally.
#
# If the build ever fails, the deploy fails with it and Pages keeps serving the
# last good publish.
name: Deploy game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue newer pushes behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle the site
        run: npm run build

      - name: Turn on Pages
        uses: actions/configure-pages@v5
        with:
          # No-op once Pages is on. Creating it from here needs rights the
          # workflow token does not have, so Pages is switched on once by
          # hand under Settings; see LOCAL-DEPLOYMENT.md.
          enablement: true

      - name: Package build/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
