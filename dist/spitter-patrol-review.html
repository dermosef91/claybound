<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block;width:100vw;height:100vh}#state{position:fixed;left:24px;top:20px;padding:12px 18px;background:#111c;color:white;font:18px system-ui;border-radius:12px}</style><div id="state">Loading…</div><canvas></canvas><script type="module">
import {World} from './world.js';import {Game} from './simulation.js';
const game=new Game();game.start(2);const enemy=game.level.enemies.find(e=>e.kind==='spitter'&&e.x>240);game.level.enemies=[enemy];
const w=new World(document.querySelector('canvas'));await w.ready;await w.prepareLevel(game.level);w.build(game.level,2,245);w.editorCamera={x:244,y:3.1,viewH:5.4};
Object.assign(game.player,{x:241,y:1.8,groundId:'gallery-watch',vx:0,vy:0});
let elapsed=0,last=performance.now();
function frame(now){const dt=Math.max(0,Math.min(.025,(now-last)/1000));last=now;elapsed+=dt;
 // First show patrol without a target in range, then enter a clear sightline.
 if(elapsed<3){game.player.x=225;game.player.invuln=1;}
 else {game.player.x=241;game.player.y=1.8;game.player.groundId='gallery-watch';game.player.invuln=0;game.player.health=3;}
 game.tick(dt,{});w.render(game,dt);document.querySelector('#state').textContent=elapsed<3?'Patrol — no sightline':enemy.aiState==='charge'?'Aim locked — winding up':enemy.aiState==='recover'?'Crystal fired from mouth':enemy.aiState;
 requestAnimationFrame(frame);}
window.review={w,game,enemy,ready:true};requestAnimationFrame(frame);
</script>
