<!doctype html>
<meta charset="utf-8">
<title>Asset preview</title>
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}</style>
<canvas id="view"></canvas>
<script type="module">
import * as THREE from './lib/three.module.js';
import {loadModel,clayMaterials} from './model-assets.js';
import {THEMES} from './environments.js';

const params=new URLSearchParams(location.search);
const file=params.get('file')||'forest-waterfall.glb';
const turn=Number(params.get('turn')||0);
const theme=THEMES[params.get('biome')||'forest'];
const canvas=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight,false);
renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.background=new THREE.Color(params.get('sky')||'#b2d2b7');
const viewH=Number(params.get('viewH')||11.6),viewW=viewH*innerWidth/innerHeight;
const camera=new THREE.OrthographicCamera(-viewW/2,viewW/2,viewH/2,-viewH/2,.1,200);
camera.position.set(0,theme.cameraElevation??3,60);camera.lookAt(0,0,0);

const hemi=new THREE.HemisphereLight(theme.skyLight,theme.groundLight,theme.ambient);scene.add(hemi);
const sun=new THREE.DirectionalLight(theme.sun,theme.sunPower);sun.position.set(-10,18,12);scene.add(sun);
const fill=new THREE.DirectionalLight(theme.fill,theme.fillPower);fill.position.set(8,4,10);scene.add(fill);

const gltf=await loadModel(file);
clayMaterials(gltf.scene,{background:true});
gltf.scene.updateMatrixWorld(true);
const box=new THREE.Box3().setFromObject(gltf.scene,true);
const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
const root=new THREE.Group();
const width=Number(params.get('width')||viewW*.82);
root.scale.setScalar(width/size.x);root.rotation.y=turn;
gltf.scene.position.set(-center.x,-center.y,-center.z);
root.add(gltf.scene);scene.add(root);

renderer.render(scene,camera);
document.body.dataset.ready='1';
globalThis.preview={size:size.toArray(),center:center.toArray()};
</script>
