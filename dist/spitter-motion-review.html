<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#858585}canvas{width:100vw;height:100vh;display:block}</style><div style="position:fixed;bottom:28px;left:0;right:0;display:flex;justify-content:space-around;color:white;font:18px system-ui"><span>Grounded idle</span><span>Refined walk</span><span>Wind-up & recoil</span></div><canvas></canvas><script type="module">
import {CLAY_PALETTE} from './palette.js';
import * as T from './lib/three.module.js';
import {World} from './world.js';import {loadClay} from './clay.js';import {applyEnvironment,buildBackdrop,animateEnvironment} from './environments.js';import {loadCavernAssets} from './cavern-asset.js';import {LEVELS} from './levels.js';import {loadSpitterAssets} from './spitter-asset.js';import {createSpitterView,animateSpitter,syncShots} from './spitter.js';import {createCaveLights} from './cave-lighting.js';
const w=Object.create(World.prototype);w.mat={};w.time=0;w.scene=new T.Scene();w.scene.fog=new T.Fog('#243c51',28,108);w.bump=new T.Texture();w.parallax=[];w.ambient=[];w.torches=[];w.torchLights=createCaveLights();w.levelRoot=new T.Group();w.backRoot=new T.Group();w.fxRoot=new T.Group();w.scene.add(w.levelRoot,w.backRoot,w.fxRoot,...w.torchLights);
for(const [k,v]of Object.entries({cream:0xf1d8a3,rope:0xdcb985,dark:0x172b3f,gold:0xf8ce75,shadow:0x333b28,orange:CLAY_PALETTE.orange,orangeLight:CLAY_PALETTE.orangeLight}))w.mat[k]=new T.MeshStandardMaterial({color:v,roughness:.98});
w.renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});w.renderer.setSize(innerWidth,innerHeight);w.renderer.toneMapping=T.ACESFilmicToneMapping;w.renderer.toneMappingExposure=1.08;
w.hemi=new T.HemisphereLight();w.sun=new T.DirectionalLight();w.fill=new T.DirectionalLight();w.sun.position.set(-8,18,12);w.fill.position.set(8,3,6);w.scene.add(w.hemi,w.sun,w.fill);
await loadClay(w);applyEnvironment(w,LEVELS[2]);
const cave=new URLSearchParams(location.search).has('cave');w.viewH=cave?10:3.3;w.viewW=w.viewH*innerWidth/innerHeight;w.cameraX=cave?8:0;w.cameraY=cave?2:.7;
w.camera=new T.OrthographicCamera(-w.viewW/2,w.viewW/2,w.viewH/2,-w.viewH/2,.1,180);w.camera.position.set(w.cameraX,w.cameraY+.25,26);w.camera.lookAt(w.cameraX,w.cameraY,0);
await loadSpitterAssets(w);w.scene.background=new T.Color('#858585');w.scene.fog=null;
const views=[],states=[];
for(let i=0;i<3;i++){
 const e={id:i,x:(i-1)*1.7,y:0,dir:-.65,alive:true,aiState:'watch',stateTime:0};states.push(e);views.push(createSpitterView(w,e));
}
let elapsed=0,last=performance.now();
function advance(dt){
 elapsed+=dt;
 for(let i=0;i<3;i++){
  const e=states[i],v=views[i];
  if(i===1){v.lastX=e.x-.16*dt;e.aiState='watch';}
  if(i===2){const t=elapsed%3.4;e.aiState=t<1.7?'watch':t<2.6?'charge':'recover';e.stateTime=t<1.7?t:t<2.6?t-1.7:t-2.6;}
  animateSpitter(v,e,dt,'playing');
 }
 w.renderer.render(w.scene,w.camera);
}
function frame(now){advance(Math.min(.033,(now-last)/1000));last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.advanceSpitter=advance;
w.renderer.render(w.scene,w.camera);window.review={w,ready:true};
</script>
